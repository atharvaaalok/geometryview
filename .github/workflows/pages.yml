# Deploys the hosted viewer, atharvaaalok.github.io/geometryview: the geometryview-web.zip a
# release carries (Launcher/scripts/site.mjs makes it), unzipped as it is. Built locally, since its
# WebAssembly needs OCCT and Emscripten, so neither the build nor the sample models enter git.
name: Hosted viewer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to deploy (the latest if empty)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the viewer from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download $TAG --repo "$GITHUB_REPOSITORY" --pattern geometryview-web.zip
          mkdir site
          unzip -q geometryview-web.zip -d site
          test -f site/index.html && test -f site/samples/index.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
