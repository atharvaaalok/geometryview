# The iPhone and iPad shell: the universal viewer's files in WKWebView, fully offline.
# Generate the Xcode project with `xcodegen` in this folder; the project itself is not committed.
name: GeometryShell
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GeometryShell:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The web files, copied as a folder so their paths stay as the page expects.
      - path: ../../Web/census
        type: folder
        buildPhase: resources
    # Generated from here at `xcodegen` time and merged with the keys below. The page's loopback
    # server is plain HTTP on 127.0.0.1, which App Transport Security allows only when asked.
    info:
      path: Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aalok.geometry.shell
        PRODUCT_NAME: Geometry
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Geometry
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
