# The iPhone and iPad shell: the universal viewer's files in WKWebView, fully offline.
# Generate the Xcode project with `xcodegen` in this folder; the project itself is not committed.
name: GeometryViewShell
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "3"
targets:
  GeometryViewShell:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The home screen icon, made by `Tools/make_icons.sh --ios`.
      - path: Assets.xcassets
      # The web files, copied as folders so their paths stay as the pages expect.
      - path: ../../Web/census
        type: folder
        buildPhase: resources
      - path: ../../Web/spike
        type: folder
        buildPhase: resources
      - path: ../../Web/viewer
        type: folder
        buildPhase: resources
    # The spikes' WebAssembly builds and fixtures, which are build outputs rather than sources:
    # `cmake --build --preset wasm-webgpu` and `--preset wasm-release`, blobs imported into
    # build/fixtures, and slices saved there by the native OCCT worker.
    postBuildScripts:
      - name: Copy the renderer spike's build
        basedOnDependencyAnalysis: false
        script: |
          spike="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/spike"
          # The spikes and their fixtures, where this checkout has them: test data, not needed to
          # build the viewer.
          if [ -d "${SRCROOT}/../../build/fixtures/slices" ]; then
            mkdir -p "$spike/build" "$spike/fixtures"
            cp "${SRCROOT}/../../build/wasm-webgpu/Tools/spikes/webgpu/spike_webgpu."{mjs,wasm} "$spike/build/"
            cp "${SRCROOT}/../../build/fixtures/"*.geoblob "$spike/fixtures/"
            # The import spike: OCCT for Web Workers, and STEP slices saved from the native importer.
            mkdir -p "$spike/occt"
            cp "${SRCROOT}/../../build/wasm-release/Import/geometryview-occt-web."{mjs,wasm} "$spike/occt/"
            rm -rf "$spike/fixtures/slices"
            cp -R "${SRCROOT}/../../build/fixtures/slices" "$spike/fixtures/slices"
            # The viewer's WebGPU renderer, timed.
            mkdir -p "$spike/bench"
            cp "${SRCROOT}/../../build/wasm-webgpu/Tools/geometryview-webgpu-bench."{mjs,wasm} "$spike/bench/"
            # Whole STEP imports: the supervisor, and the files it reads.
            cp "${SRCROOT}/../../build/wasm-release/Import/geometryview-step-web."{mjs,wasm} "$spike/occt/"
            rm -rf "$spike/fixtures/step"
            cp -R "${SRCROOT}/../../build/fixtures/step" "$spike/fixtures/step"
          fi
          # The viewer: its engine, its picture worker's renderer and fonts. It opens fixtures from
          # the spike's folder.
          viewer="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/viewer"
          mkdir -p "$viewer/build" "$viewer/fonts"
          cp "${SRCROOT}/../../build/wasm-webgpu/Engine/geometryview-"{web,thumbs-web}"."{mjs,wasm} "$viewer/build/"
          cp "${SRCROOT}/../../ThirdParty/ibm-plex-mono/"*.ttf "$viewer/fonts/"
          # Its importers: the supervisor, single- and multi-threaded, and OCCT for its workers.
          mkdir -p "$viewer/occt" "$viewer/occt-threads"
          cp "${SRCROOT}/../../build/wasm-release/Import/geometryview-"{step,occt}"-web."{mjs,wasm} "$viewer/occt/"
          cp "${SRCROOT}/../../build/wasm-threads/Import/geometryview-step-web."{mjs,wasm} "$viewer/occt-threads/"
    # Generated from here at `xcodegen` time and merged with the keys below. The page's loopback
    # server is plain HTTP on 127.0.0.1, which App Transport Security allows only when asked.
    info:
      path: Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # STEP and STL files open in the shell from Files and the share sheet.
        CFBundleDocumentTypes:
          - CFBundleTypeName: STEP model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.iso.step]
          - CFBundleTypeName: STL model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.standard-tesselated-geometry-format]
        # GeometryView's own cache files, which the picker offers too.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.aalok.geometryview.cache
            UTTypeDescription: GeometryView cache
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [geoblob]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.iso.step
            UTTypeDescription: STEP model
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [step, stp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aalok.geometryview
        PRODUCT_NAME: GeometryView
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GeometryView
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        # The spike's copy script reads build outputs outside the project.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
